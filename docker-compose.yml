services:
  civic-postgres:
    image: postgis/postgis:16-3.4
    container_name: civicresolve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicresolve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicresolve"]
      interval: 5s
      timeout: 5s
      retries: 5

  civic-redis:
    image: redis:7-alpine
    container_name: civicresolve_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  civic-minio:
    image: minio/minio:latest
    container_name: civicresolve_storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
