services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicresolve_app
    restart: unless-stopped
    depends_on:
      civic-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@civic-postgres:5432/civicresolve
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CIVRES_JWT_SECRET: ${CIVRES_JWT_SECRET:-civicresolve-dgp-demo-secret-change-in-prod}
    ports:
      - "3010:8080"

  civic-postgres:
    image: postgis/postgis:16-3.4
    container_name: civicresolve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicresolve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicresolve"]
      interval: 5s
      timeout: 5s
      retries: 5

  civic-redis:
    image: redis:7-alpine
    container_name: civicresolve_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  civic-minio:
    image: minio/minio:latest
    container_name: civicresolve_storage
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
